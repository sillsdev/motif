name: Queue keeper

# Cancels runs of dead merge-queue groups and requeues pull requests the queue evicted only for known flaky tests.
# The logic is tools/queue-keeper.ps1; it writes what it did to the run summary. Dry run changes nothing.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would change without cancelling or requeuing'
        type: boolean
        default: false

permissions:
  actions: write
  pull-requests: write
  contents: read
  issues: read

concurrency:
  group: queue-keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Keep the queue
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: ./tools/queue-keeper.ps1

name: CI

# Runs the same two scripts a developer runs, so CI cannot disagree with a local run about what passes.
on:
  push:
    branches: ['**', '!mac-debug/**']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MSBUILDDISABLENODEREUSE: '1'
      UseSharedCompilation: 'false'
      AVALONIA_TELEMETRY_OPTOUT: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install LibLCM ICU (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          wget -qO - http://linux.lsdev.sil.org/downloads/sil-testing.gpg | sudo tee /etc/apt/trusted.gpg.d/linux-lsdev-sil-org.asc
          sudo add-apt-repository "deb http://linux.lsdev.sil.org/ubuntu $(lsb_release -sc)-experimental main"
          sudo apt-get update
          sudo apt-get install -y icu-fw

      - name: Install LibLCM ICU (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install icu4c
          echo "DYLD_LIBRARY_PATH=$(brew --prefix icu4c)/lib:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$(brew --prefix icu4c)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Build (comment hygiene, then compile)
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Test (full suite)
        shell: pwsh
        run: ./test.ps1 -Configuration Release -SkipBuild

      # A console summary names failing tests but not why; the per-project logs and TRX files do.
      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: bin/Release/test-results/
          if-no-files-found: ignore
          retention-days: 14

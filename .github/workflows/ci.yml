name: CI

# Runs the same two scripts a developer runs, so CI cannot disagree with a local run about what passes.
on:
  push:
    branches: ['**', '!mac-debug/**', '!linux-debug/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_website:
        description: 'Validate release documentation and upload the generated website'
        type: boolean
        default: false

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            icu_rid: win-x64
          - os: ubuntu-22.04
            icu_rid: linux-x64
          - os: macos-15
            icu_rid: osx-arm64
          - os: macos-15-intel
            icu_rid: osx-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      MSBUILDDISABLENODEREUSE: '1'
      UseSharedCompilation: 'false'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      ICU_RID: ${{ matrix.icu_rid }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read pinned SIL ICU source revision
        if: runner.os == 'macOS'
        id: sil-icu-source
        shell: bash
        run: |
          commit=$(jq -r --arg rid "$ICU_RID" '.rids[$rid].source.commit' tools/icu-payload.json)
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Fetch SIL ICU runtime (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          root=$(bash tools/stage-sil-icu.sh "$RUNNER_TEMP/sil-icu/linux-x64" | tail -1)
          printf 'MOTIF_SIL_ICU_STAGE=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Cache SIL ICU source build (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sil-icu/${{ matrix.icu_rid }}/install
          key: sil-icu-${{ matrix.icu_rid }}-${{ steps.sil-icu-source.outputs.commit }}-${{ hashFiles('tools/patches/sil-icu-macos-malloc-header.patch') }}

      - name: Build SIL ICU from source (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          payload=tools/icu-payload.json
          runtime=$(jq -r --arg rid "$ICU_RID" '.rids[$rid]' "$payload")
          commit=$(jq -r '.source.commit' <<< "$runtime")
          repository=$(jq -r '.source.repository' <<< "$runtime")
          source_directory=$(jq -r '.source.sourceDirectory' <<< "$runtime")
          root="$RUNNER_TEMP/sil-icu/$ICU_RID"
          source_root="$root/source"
          prefix="$root/install"
          case "$ICU_RID:$(uname -m)" in
            osx-arm64:arm64|osx-x64:x86_64) ;;
            *) echo "Runner architecture $(uname -m) does not match $ICU_RID" >&2; exit 1 ;;
          esac
          if [[ ! -f "$prefix/lib/libicuuc.70.dylib" ]]; then
            mkdir -p "$root"
            if [[ ! -d "$source_root/.git" ]]; then
              git init "$source_root"
              git -C "$source_root" remote add origin "$repository"
            fi
            git -C "$source_root" fetch --depth=1 origin "$commit"
            git -C "$source_root" checkout --detach FETCH_HEAD
            patch=$(jq -r '.buildPatches[] | select(.id == "silmods-macos-malloc-header") | .path' "$GITHUB_WORKSPACE/$payload")
            git -C "$source_root" apply --check "$GITHUB_WORKSPACE/$patch"
            git -C "$source_root" apply "$GITHUB_WORKSPACE/$patch"
            cd "$source_root/$source_directory"
            ./runConfigureICU MacOSX --prefix="$prefix" --enable-shared --enable-static=no --with-data-packaging=library
            make -j"$(sysctl -n hw.ncpu)"
            make install
            for library in "$prefix"/lib/libicu*.70.dylib; do
              [[ -f "$library" ]] || continue
              while IFS= read -r dependency; do
                case "$dependency" in
                  "$prefix"/lib/*)
                    install_name_tool -change "$dependency" "@loader_path/$(basename "$dependency")" "$library"
                    ;;
                esac
              done < <(otool -L "$library" | awk 'NR > 1 { print $1 }' | grep '\.dylib$' || true)
              install_name_tool -add_rpath '@loader_path' "$library" 2>/dev/null || true
              codesign --force --sign - "$library"
            done
          fi
          printf 'MOTIF_SIL_ICU_STAGE=%s\n' "$prefix/lib" >> "$GITHUB_ENV"

      - name: Build (comment hygiene, then compile)
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Stage pinned PanGloss release
        shell: pwsh
        run: |
          Import-Module ./tools/PanGlossRelease.psm1
          $artifact = Get-PinnedPanGlossArtifact -RepositoryRoot (Get-Location).Path `
            -CacheDirectory (Join-Path $env:RUNNER_TEMP "motif-pangloss/$env:ICU_RID")
          "MOTIF_PANGLOSS_EXE=$($artifact.Path)" >> $env:GITHUB_ENV

      - name: Hermetic check (Ubuntu)
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./tools/Test-HermeticBuild.ps1

      - name: Test (full suite)
        shell: pwsh
        run: ./test.ps1 -Configuration Release -SkipBuild -All

      - name: Require released PanGloss integration results
        shell: pwsh
        run: ./tools/Assert-RequiredPanGloss.ps1 -ResultsDirectory (Join-Path (Get-Location).Path 'bin/Release/test-results')

      - name: Verify PanGloss pin mode handling
        shell: pwsh
        run: ./tools/Test-PanGlossRelease.ps1 -RepositoryRoot (Get-Location).Path -ProbeRoot (Join-Path $env:RUNNER_TEMP 'motif-pangloss-pin-probe')

      # A console summary names failing tests but not why; the per-project logs and TRX files do.
      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: bin/Release/test-results/
          if-no-files-found: ignore
          retention-days: 14

      # An aborting child leaves only exit code 134 in the test output; macOS's crash report holds its native stack.
      - name: Collect macOS crash reports
        if: runner.os == 'macOS' && (failure() || cancelled())
        shell: bash
        run: |
          mkdir -p bin/Release/crash-reports
          cp "$HOME"/Library/Logs/DiagnosticReports/*.ips bin/Release/crash-reports/ 2>/dev/null || true
          ls -la bin/Release/crash-reports

      - name: Upload macOS crash reports
        if: runner.os == 'macOS' && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: crash-reports-${{ matrix.os }}
          path: bin/Release/crash-reports/
          if-no-files-found: ignore
          retention-days: 14

  documentation-release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_website
    runs-on: windows-latest
    timeout-minutes: 180
    env:
      MSBUILDDISABLENODEREUSE: '1'
      UseSharedCompilation: 'false'
      AVALONIA_TELEMETRY_OPTOUT: '1'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.x'

      - name: Install ffmpeg
        shell: pwsh
        run: choco install ffmpeg --yes --no-progress

      - name: Validate release documentation inputs and build site
        shell: pwsh
        run: ./tools/validate-documentation.ps1 -ReleaseValidation

      - name: Upload generated documentation site
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: documentation-site
          path: site/dist/
          if-no-files-found: error
          retention-days: 14

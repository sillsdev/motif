# Temporary hang diagnostics; remove this workflow after the macOS hang is fixed.
name: macOS crash diagnostics

on:
  push:
    branches: ['mac-crash/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crash-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            icu_rid: osx-arm64
          - os: macos-15-intel
            icu_rid: osx-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      MSBUILDDISABLENODEREUSE: '1'
      UseSharedCompilation: 'false'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      ICU_RID: ${{ matrix.icu_rid }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install hang diagnostic tools
        shell: bash
        run: |
          dotnet tool install -g dotnet-stack
          dotnet tool install -g dotnet-dump
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Create diagnostic output directories
        shell: bash
        run: |
          mkdir -p bin/Release/mac-crash

      - name: Read pinned SIL ICU source revision
        id: sil-icu-source
        shell: bash
        run: |
          commit=$(jq -r --arg rid "$ICU_RID" '.rids[$rid].source.commit' tools/icu-payload.json)
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Cache SIL ICU source build
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sil-icu/${{ matrix.icu_rid }}/install
          key: sil-icu-${{ matrix.icu_rid }}-${{ steps.sil-icu-source.outputs.commit }}-${{ hashFiles('tools/patches/sil-icu-macos-malloc-header.patch') }}

      - name: Build SIL ICU from source
        shell: bash
        run: |
          payload=tools/icu-payload.json
          runtime=$(jq -r --arg rid "$ICU_RID" '.rids[$rid]' "$payload")
          commit=$(jq -r '.source.commit' <<< "$runtime")
          repository=$(jq -r '.source.repository' <<< "$runtime")
          source_directory=$(jq -r '.source.sourceDirectory' <<< "$runtime")
          root="$RUNNER_TEMP/sil-icu/$ICU_RID"
          source_root="$root/source"
          prefix="$root/install"
          case "$ICU_RID:$(uname -m)" in
            osx-arm64:arm64|osx-x64:x86_64) ;;
            *) echo "Runner architecture $(uname -m) does not match $ICU_RID" >&2; exit 1 ;;
          esac
          if [[ ! -f "$prefix/lib/libicuuc.70.dylib" ]]; then
            mkdir -p "$root"
            if [[ ! -d "$source_root/.git" ]]; then
              git init "$source_root"
              git -C "$source_root" remote add origin "$repository"
            fi
            git -C "$source_root" fetch --depth=1 origin "$commit"
            git -C "$source_root" checkout --detach FETCH_HEAD
            patch=$(jq -r '.buildPatches[] | select(.id == "silmods-macos-malloc-header") | .path' "$GITHUB_WORKSPACE/$payload")
            git -C "$source_root" apply --check "$GITHUB_WORKSPACE/$patch"
            git -C "$source_root" apply "$GITHUB_WORKSPACE/$patch"
            cd "$source_root/$source_directory"
            ./runConfigureICU MacOSX --prefix="$prefix" --enable-shared --enable-static=no --with-data-packaging=library
            make -j"$(sysctl -n hw.ncpu)"
            make install
            for library in "$prefix"/lib/libicu*.70.dylib; do
              [[ -f "$library" ]] || continue
              while IFS= read -r dependency; do
                case "$dependency" in
                  "$prefix"/lib/*)
                    install_name_tool -change "$dependency" "@loader_path/$(basename "$dependency")" "$library"
                    ;;
                esac
              done < <(otool -L "$library" | awk 'NR > 1 { print $1 }' | grep '\.dylib$' || true)
              install_name_tool -add_rpath '@loader_path' "$library" 2>/dev/null || true
              codesign --force --sign - "$library"
            done
          fi
          printf 'MOTIF_SIL_ICU_STAGE=%s\n' "$prefix/lib" >> "$GITHUB_ENV"

      - name: Build Motif
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Stage SIL ICU beside Motif and test hosts
        shell: bash
        run: |
          payload=tools/icu-payload.json
          destination=$(jq -r --arg rid "$ICU_RID" '.rids[$rid].nativeOutputDirectory' "$payload")
          product="bin/Release/$destination"
          tests="bin/Release/tests/$destination"
          mkdir -p "$product" "$tests"
          for library in "$MOTIF_SIL_ICU_STAGE"/libicu*.dylib; do
            [[ -e "$library" || -L "$library" ]] || continue
            cp -a "$library" "$product/"
            cp -a "$library" "$tests/"
          done
          while IFS= read -r library; do
            [[ -e "$product/$library" ]] || { echo "Missing staged ICU library: $product/$library" >&2; exit 1; }
            [[ -e "$tests/$library" ]] || { echo "Missing staged ICU library: $tests/$library" >&2; exit 1; }
          done < <(jq -r --arg rid "$ICU_RID" '.rids[$rid].libraries[]' "$payload")

      - name: Probe staged SIL ICU apphosts
        continue-on-error: true
        shell: bash
        run: |
          diagnostics="$GITHUB_WORKSPACE/bin/Release/mac-crash"
          product="$GITHUB_WORKSPACE/bin/Release"
          test_temp="$diagnostics/test-temp"
          copied_project="$diagnostics/copied-project"
          worker_root="$diagnostics/worker-root"
          writing_systems="$diagnostics/writing-systems"
          mkdir -p "$diagnostics" "$test_temp" "$copied_project" "$worker_root" "$writing_systems"

          run_capture() {
            label=$1
            limit=$2
            shift 2
            stdout="$diagnostics/$label.stdout.txt"
            stderr="$diagnostics/$label.stderr.txt"
            printf 'Running %s:' "$label"
            printf ' %q' "$@"
            printf '\n'
            "$@" > "$stdout" 2> "$stderr" &
            pid=$!
            elapsed=0
            timed_out=0
            while kill -0 "$pid" 2>/dev/null && ((elapsed < limit)); do
              sleep 1
              elapsed=$((elapsed + 1))
            done
            if kill -0 "$pid" 2>/dev/null; then
              timed_out=1
              kill -TERM "$pid" 2>/dev/null || true
              sleep 2
              kill -KILL "$pid" 2>/dev/null || true
            fi
            if wait "$pid"; then status=0; else status=$?; fi
            printf '%s exit code: %s%s\n' "$label" "$status" \
              "$([[ "$timed_out" == 1 ]] && printf ' (killed after %s seconds)' "$limit")"
            printf '%s stdout:\n' "$label"
            cat "$stdout"
            printf '%s stderr:\n' "$label"
            cat "$stderr"
            printf '\n'
          }

          TMPDIR="$test_temp/" \
          MOTIF_WRITING_SYSTEM_REPOSITORY_PATH="$writing_systems" \
            dotnet test tests/SIL.Motif.Tests.Commands/SIL.Motif.Tests.Commands.csproj \
              --configuration Release --nologo --no-build \
              --filter 'FullyQualifiedName~PendingChangesWorkflowTests.ApplyingWhenNoChangesArePendingReturnsTheNoWorkOutcome' \
              > "$diagnostics/fixture-test.stdout.txt" \
              2> "$diagnostics/fixture-test.stderr.txt" &
          fixture_pid=$!
          fixture_source=
          for ((attempt = 0; attempt < 90; attempt++)); do
            for candidate in "$test_temp"/SIL.Motif.Tests.Pristine/*/MotifTestProj/MotifTestProj.fwdata; do
              if [[ -f "$candidate" ]]; then
                fixture_source=$(dirname "$candidate")
                break 2
              fi
            done
            if ! kill -0 "$fixture_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [[ -n "$fixture_source" ]]; then
            cp -a "$fixture_source" "$copied_project/MotifTestProj"
            echo "Copied LibLCM test project to $copied_project/MotifTestProj"
          else
            echo "The LibLCM test fixture did not produce a project directory."
          fi
          if kill -0 "$fixture_pid" 2>/dev/null; then
            kill -TERM "$fixture_pid" 2>/dev/null || true
            sleep 2
            kill -KILL "$fixture_pid" 2>/dev/null || true
          fi
          if wait "$fixture_pid"; then fixture_status=0; else fixture_status=$?; fi
          echo "fixture test exit code: $fixture_status"
          echo "fixture test stdout:"
          cat "$diagnostics/fixture-test.stdout.txt"
          echo "fixture test stderr:"
          cat "$diagnostics/fixture-test.stderr.txt"

          run_capture cli-version 30 "$product/motif" --version
          run_capture cli-version-dyld 30 env DYLD_PRINT_LIBRARIES=1 "$product/motif" --version
          run_capture cli-open-project 90 env \
            MOTIF_WORKER_ROOT="$worker_root" \
            MOTIF_WRITING_SYSTEM_REPOSITORY_PATH="$writing_systems" \
            "$product/motif" open "$copied_project/MotifTestProj.fwdata"
          run_capture worker-startup 20 "$product/SIL.Motif.Worker" \
            --root "$worker_root" --no-parser --namespace motif-icu-probe \
            --idle-ms 60000 --lease-ms 300000

      - name: Run selected hang reproductions and capture stacks
        shell: bash
        run: |
          diagnostics="$GITHUB_WORKSPACE/bin/Release/mac-crash"
          cli_results="$diagnostics/SIL.Motif.Tests.Cli"
          commands_results="$diagnostics/SIL.Motif.Tests.Commands"
          mkdir -p "$cli_results" "$commands_results"

          dotnet test tests/SIL.Motif.Tests.Cli/SIL.Motif.Tests.Cli.csproj \
            --configuration Release --nologo --no-build \
            --results-directory "$cli_results" \
            --logger 'trx;LogFileName=SIL.Motif.Tests.Cli.trx' \
            --filter 'FullyQualifiedName~PendingApplyArgvTests' \
            > "$diagnostics/SIL.Motif.Tests.Cli.log" 2>&1 &
          cli_pid=$!

          dotnet test tests/SIL.Motif.Tests.Commands/SIL.Motif.Tests.Commands.csproj \
            --configuration Release --nologo --no-build \
            --results-directory "$commands_results" \
            --logger 'trx;LogFileName=SIL.Motif.Tests.Commands.trx' \
            --filter 'FullyQualifiedName~PendingChangesWorkflowTests' \
            > "$diagnostics/SIL.Motif.Tests.Commands.log" 2>&1 &
          commands_pid=$!

          deadline=$((SECONDS + 240))
          timed_out=0
          while kill -0 "$cli_pid" 2>/dev/null || kill -0 "$commands_pid" 2>/dev/null; do
            if ((SECONDS >= deadline)); then
              timed_out=1
              break
            fi
            sleep 5
          done

          if ((timed_out)); then
            echo "A selected test process remained active after four minutes; capturing stacks."
            ps -axo pid,ppid,stat,etime,command > "$diagnostics/processes.txt"
            matching_pids=$(awk '
              index($0, "testhost") || index($0, "SIL.Motif") || $0 ~ /\/motif([[:space:]]|$)/ { print $1 }
            ' "$diagnostics/processes.txt")
            capture_pids=$(printf '%s\n%s\n%s\n' "$cli_pid" "$commands_pid" "$matching_pids" | awk 'NF && !seen[$1]++ { print $1 }')

            while IFS= read -r pid; do
              [[ -n "$pid" ]] || continue
              sample "$pid" 10 -file "$diagnostics/sample-$pid.txt" \
                > "$diagnostics/sample-command-$pid.txt" 2>&1 || true
              dotnet-stack report -p "$pid" \
                > "$diagnostics/managed-$pid.txt" 2>&1 || true
              if dotnet-dump collect -p "$pid" -o "$diagnostics/dump-$pid" \
                > "$diagnostics/dump-collect-$pid.txt" 2>&1; then
                dotnet-dump analyze "$diagnostics/dump-$pid" \
                  -c "clrthreads" -c "clrstack -all" -c "exit" \
                  > "$diagnostics/clrstack-$pid.txt" 2>&1 || true
              fi
            done <<< "$capture_pids"

            ps -axo pid=,ppid= > "$diagnostics/process-tree.txt"
            tree_pids=$(awk -v roots="$cli_pid $commands_pid $capture_pids" '
              BEGIN {
                count = split(roots, root, /[[:space:]]+/)
                for (i = 1; i <= count; i++) if (root[i] != "") wanted[root[i]] = 1
              }
              { pids[++n] = $1; parent[$1] = $2 }
              END {
                do {
                  changed = 0
                  for (i = 1; i <= n; i++) {
                    pid = pids[i]
                    if (wanted[parent[pid]] && !wanted[pid]) {
                      wanted[pid] = 1
                      changed = 1
                    }
                  }
                } while (changed)
                for (i = n; i >= 1; i--) if (wanted[pids[i]]) print pids[i]
              }
            ' "$diagnostics/process-tree.txt")
            while IFS= read -r pid; do
              [[ -n "$pid" ]] && kill -TERM "$pid" 2>/dev/null || true
            done <<< "$tree_pids"
            sleep 5
            while IFS= read -r pid; do
              [[ -n "$pid" ]] && kill -KILL "$pid" 2>/dev/null || true
            done <<< "$tree_pids"

            wait "$cli_pid" 2>/dev/null || true
            wait "$commands_pid" 2>/dev/null || true
            cat "$diagnostics/SIL.Motif.Tests.Cli.log" "$diagnostics/SIL.Motif.Tests.Commands.log"
            echo "Hang diagnostics captured; terminated the selected test process trees."
            exit 124
          fi

          cli_status=0
          commands_status=0
          wait "$cli_pid" || cli_status=$?
          wait "$commands_pid" || commands_status=$?
          cat "$diagnostics/SIL.Motif.Tests.Cli.log" "$diagnostics/SIL.Motif.Tests.Commands.log"
          if ((cli_status != 0 || commands_status != 0)); then
            exit 1
          fi

      - name: Prepare hang diagnostics
        if: always()
        shell: bash
        run: |
          output="$GITHUB_WORKSPACE/bin/Release/mac-crash"
          mkdir -p "$output"
          dump_bytes=0
          for dump in "$output"/dump-[0-9]*; do
            [[ -f "$dump" ]] || continue
            dump_bytes=$((dump_bytes + $(stat -f '%z' "$dump")))
          done
          if ((dump_bytes > 524288000)); then
            echo "Raw dumps total $dump_bytes bytes; removing them from the artifact."
            for dump in "$output"/dump-[0-9]*; do
              [[ -f "$dump" ]] && rm -f "$dump"
            done
          fi
          find "$output" -maxdepth 2 -type f -print

      - name: Upload macOS crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-crash-${{ matrix.os }}
          path: bin/Release/mac-crash/
          if-no-files-found: error
          retention-days: 14

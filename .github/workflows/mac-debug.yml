name: mac debug

# A fast macOS loop: a push to mac-debug/** runs only the tests named in .github/mac-debug.txt on a
# macOS runner, so a platform fix is checked in minutes instead of a full three-OS suite.
# .github/mac-debug.txt holds one "<test project name> | <dotnet test --filter expression>" per line;
# an empty filter runs that whole project.
on:
  push:
    branches: ['mac-debug/**']

jobs:
  mac-debug:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      MSBUILDDISABLENODEREUSE: '1'
      UseSharedCompilation: 'false'
      AVALONIA_TELEMETRY_OPTOUT: '1'
      ICU_RID: ${{ matrix.runner == 'macos-15' && 'osx-arm64' || 'osx-x64' }}
      MOTIF_DEVELOPER_COMMANDS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read pinned SIL ICU source revision
        if: runner.os == 'macOS'
        id: sil-icu-source
        shell: bash
        run: |
          commit=$(jq -r --arg rid "$ICU_RID" '.rids[$rid].source.commit' tools/icu-payload.json)
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

      - name: Fetch SIL ICU runtime (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          payload=tools/icu-payload.json
          root="$RUNNER_TEMP/sil-icu/linux-x64"
          mkdir -p "$root/debs" "$root/extracted"
          repository=$(jq -r '.rids["linux-x64"].sources[0].repository' "$payload")
          while IFS=$'\t' read -r path checksum ships size; do
            deb="$root/debs/$(basename "$path")"
            curl --fail --location --retry 3 "$repository/$path" --output "$deb"
            printf '%s  %s\n' "$checksum" "$deb" | sha256sum --check --status
            if [[ -n "$size" && "$(stat -c '%s' "$deb")" != "$size" ]]; then
              echo "Unexpected size for $deb" >&2
              exit 1
            fi
            if [[ "$ships" == true ]]; then
              dpkg-deb --extract "$deb" "$root/extracted"
            fi
          done < <(jq -r '.rids["linux-x64"].sources[] | [.path, .sha256, .ships, (.size // "")] | @tsv' "$payload")
          sudo apt-get update
          sudo apt-get install --yes patchelf
          find "$root/extracted" \( -type f -o -type l \) -name 'libicu*.so*' -print0 |
            while IFS= read -r -d '' library; do
              cp --archive "$library" "$root/"
            done
          find "$root" -maxdepth 1 -type f -name 'libicu*.so.*' -print0 |
            while IFS= read -r -d '' library; do
              patchelf --set-rpath '$ORIGIN' "$library"
            done
          printf 'MOTIF_SIL_ICU_STAGE=%s\n' "$root" >> "$GITHUB_ENV"

      - name: Cache SIL ICU source build (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sil-icu/${{ matrix.icu_rid }}/install
          key: sil-icu-${{ matrix.icu_rid }}-${{ steps.sil-icu-source.outputs.commit }}-${{ hashFiles('tools/patches/sil-icu-macos-malloc-header.patch') }}

      - name: Build SIL ICU from source (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          payload=tools/icu-payload.json
          runtime=$(jq -r --arg rid "$ICU_RID" '.rids[$rid]' "$payload")
          commit=$(jq -r '.source.commit' <<< "$runtime")
          repository=$(jq -r '.source.repository' <<< "$runtime")
          source_directory=$(jq -r '.source.sourceDirectory' <<< "$runtime")
          root="$RUNNER_TEMP/sil-icu/$ICU_RID"
          source_root="$root/source"
          prefix="$root/install"
          case "$ICU_RID:$(uname -m)" in
            osx-arm64:arm64|osx-x64:x86_64) ;;
            *) echo "Runner architecture $(uname -m) does not match $ICU_RID" >&2; exit 1 ;;
          esac
          if [[ ! -f "$prefix/lib/libicuuc.70.dylib" ]]; then
            mkdir -p "$root"
            if [[ ! -d "$source_root/.git" ]]; then
              git init "$source_root"
              git -C "$source_root" remote add origin "$repository"
            fi
            git -C "$source_root" fetch --depth=1 origin "$commit"
            git -C "$source_root" checkout --detach FETCH_HEAD
            patch=$(jq -r '.buildPatches[] | select(.id == "silmods-macos-malloc-header") | .path' "$GITHUB_WORKSPACE/$payload")
            git -C "$source_root" apply --check "$GITHUB_WORKSPACE/$patch"
            git -C "$source_root" apply "$GITHUB_WORKSPACE/$patch"
            cd "$source_root/$source_directory"
            ./runConfigureICU MacOSX --prefix="$prefix" --enable-shared --enable-static=no --with-data-packaging=library
            make -j"$(sysctl -n hw.ncpu)"
            make install
            for library in "$prefix"/lib/libicu*.70.dylib; do
              [[ -f "$library" ]] || continue
              while IFS= read -r dependency; do
                case "$dependency" in
                  "$prefix"/lib/*)
                    install_name_tool -change "$dependency" "@loader_path/$(basename "$dependency")" "$library"
                    ;;
                esac
              done < <(otool -L "$library" | awk 'NR > 1 { print $1 }' | grep '\.dylib$' || true)
              install_name_tool -add_rpath '@loader_path' "$library" 2>/dev/null || true
              codesign --force --sign - "$library"
            done
          fi
          printf 'MOTIF_SIL_ICU_STAGE=%s\n' "$prefix/lib" >> "$GITHUB_ENV"

      - name: Build
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Stage SIL ICU beside Motif and test hosts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          payload=tools/icu-payload.json
          destination=$(jq -r --arg rid "$ICU_RID" '.rids[$rid].nativeOutputDirectory' "$payload")
          product="bin/Release/$destination"
          tests="bin/Release/tests/$destination"
          mkdir -p "$product" "$tests"
          if [[ "$RUNNER_OS" == Linux ]]; then
            for library in "$MOTIF_SIL_ICU_STAGE"/libicu*.so*; do
              [[ -e "$library" || -L "$library" ]] || continue
              cp -a "$library" "$product/"
              cp -a "$library" "$tests/"
            done
          else
            for library in "$MOTIF_SIL_ICU_STAGE"/libicu*.dylib; do
              [[ -e "$library" || -L "$library" ]] || continue
              cp -a "$library" "$product/"
              cp -a "$library" "$tests/"
            done
          fi
          while IFS= read -r library; do
            [[ -e "$product/$library" ]] || { echo "Missing staged ICU library: $product/$library" >&2; exit 1; }
            [[ -e "$tests/$library" ]] || { echo "Missing staged ICU library: $tests/$library" >&2; exit 1; }
          done < <(jq -r --arg rid "$ICU_RID" '.rids[$rid].libraries[]' "$payload")

      - name: Prepare the selected test artifacts
        shell: pwsh
        run: ./tools/Prepare-TestArtifacts.ps1 -Configuration Release -ExplainedWordCardFixture

      - name: Run the selected tests
        shell: pwsh
        run: |
          $out = 'bin/Release/mac-debug'
          New-Item -ItemType Directory -Force $out | Out-Null
          $failed = $false
          $runNumber = 0
          foreach ($line in Get-Content .github/mac-debug.txt) {
            if ([string]::IsNullOrWhiteSpace($line) -or $line.TrimStart().StartsWith('#')) { continue }
            $runNumber++
            $project, $filter = $line.Split('|', 2) | ForEach-Object { $_.Trim() }
            $runName = "$project-$runNumber"
            $csproj = "tests/$project/$project.csproj"
            if ($filter -match 'LargeProjectScaleTests|UnparsedLargeProjectScaleTests') {
              $env:MOTIF_SCALE_DIAGNOSTICS = '1'
              $consoleVerbosity = 'detailed'
            } else {
              Remove-Item Env:MOTIF_SCALE_DIAGNOSTICS -ErrorAction SilentlyContinue
              $consoleVerbosity = 'normal'
            }
            $testArgs = @('test', $csproj, '-c', 'Release', '--no-build', '--logger', "console;verbosity=$consoleVerbosity",
              '--logger', "trx;LogFileName=$runName.trx", '--results-directory', "$out/$runName",
              '--blame-hang-timeout', '5m', '--blame-hang-dump-type', 'none')
            if ($filter) { $testArgs += @('--filter', $filter) }
            Write-Host "==> $project $filter"
            dotnet @testArgs 2>&1 | Tee-Object -FilePath "$out/$runName.log"
            if ($LASTEXITCODE -ne 0) { $failed = $true }
          }
          if ($failed) { exit 1 }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-debug-results-${{ matrix.runner }}
          path: bin/Release/mac-debug/
          retention-days: 7

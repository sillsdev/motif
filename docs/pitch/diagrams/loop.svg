<svg xmlns="http://www.w3.org/2000/svg" viewBox="56 40 816 304" role="img" aria-label="The grammar-improvement loop: assess, pick, hand off, propose, review, apply">
  <defs><marker id="loop-head-003049" orient="auto" markerWidth="5" markerHeight="5" refX="3.2" refY="2" overflow="visible"><path d="M0 0 L4 2 L0 4 Z" fill="#003049"/></marker></defs>
  <circle cx="610" cy="58" r="6" fill="#D0DCF5" stroke="#005CB9" stroke-width="2"/>
  <text x="622" y="62" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" fill="#5B6770" text-anchor="start"><tspan x="622" dy="0" font-size="13" font-weight="500">AI assistant</tspan></text>
  <circle cx="730" cy="58" r="6" fill="#C0EEF6" stroke="#0087B8" stroke-width="2"/>
  <text x="742" y="62" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" fill="#5B6770" text-anchor="start"><tspan x="742" dy="0" font-size="13" font-weight="500">Person decides</tspan></text>
  <path d="M 264 156 L 362 156" stroke="#003049" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#loop-head-003049)"/>
  <path d="M 564 156 L 662 156" stroke="#003049" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#loop-head-003049)"/>
  <path d="M 764 192 L 764 262" stroke="#003049" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#loop-head-003049)"/>
  <path d="M 664 300 L 566 300" stroke="#003049" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#loop-head-003049)"/>
  <path d="M 364 300 L 266 300" stroke="#003049" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#loop-head-003049)"/>
  <path d="M 164 264 L 164 194" stroke="#003049" stroke-width="2" stroke-linecap="round" fill="none" marker-end="url(#loop-head-003049)"/>
  <rect x="64" y="120" width="200" height="72" rx="12" fill="#F2F6FA"/>
  <text x="78" y="152.0" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" fill="#003049" text-anchor="start"><tspan x="78" dy="0" font-size="15" font-weight="600">1 · Assess</tspan><tspan x="78" dy="18" font-size="13" font-weight="400">PanGloss parses the texts</tspan></text>
  <rect x="364" y="120" width="200" height="72" rx="12" fill="#C0EEF6"/>
  <text x="378" y="152.0" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" fill="#003049" text-anchor="start"><tspan x="378" dy="0" font-size="15" font-weight="600">2 · Pick</tspan><tspan x="378" dy="18" font-size="13" font-weight="400">the words that matter</tspan></text>
  <rect x="664" y="120" width="200" height="72" rx="12" fill="#F2F6FA"/>
  <text x="678" y="152.0" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" fill="#003049" text-anchor="start"><tspan x="678" dy="0" font-size="15" font-weight="600">3 · Hand off</tspan><tspan x="678" dy="18" font-size="13" font-weight="400">words, traces and grammar</tspan></text>
  <rect x="664" y="264" width="200" height="72" rx="12" fill="#D0DCF5"/>
  <text x="678" y="296.0" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" fill="#003049" text-anchor="start"><tspan x="678" dy="0" font-size="15" font-weight="600">4 · Propose</tspan><tspan x="678" dy="18" font-size="13" font-weight="400">explain it, draft a Proposal</tspan></text>
  <rect x="364" y="264" width="200" height="72" rx="12" fill="#C0EEF6"/>
  <text x="378" y="296.0" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" fill="#003049" text-anchor="start"><tspan x="378" dy="0" font-size="15" font-weight="600">5 · Review</tspan><tspan x="378" dy="18" font-size="13" font-weight="400">read it, see its Dry Run</tspan></text>
  <rect x="64" y="264" width="200" height="72" rx="12" fill="#F2F6FA"/>
  <text x="78" y="296.0" font-family="'Source Sans 3', 'Segoe UI', Arial, sans-serif" fill="#003049" text-anchor="start"><tspan x="78" dy="0" font-size="15" font-weight="600">6 · Apply</tspan><tspan x="78" dy="18" font-size="13" font-weight="400">one step, then re-assess</tspan></text>
  <text x="464" y="233" font-family="'Charis SIL', Georgia, serif" fill="#5B6770" text-anchor="middle" font-style="italic"><tspan x="464" dy="0" font-size="14" font-weight="400">each turn in minutes, not months</tspan></text>
